spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/app?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
server.port=8080
server.address=127.0.0.1
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict
server.error.include-stacktrace=never
server.error.include-message=never
server.servlet.session.cookie.path=/
server.servlet.session.timeout=60m
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
