# 요청 빈도 제한 (sites-enabled 는 http 블록 안에서 include 됨)
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name ldg.recruit.kayple.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ldg.recruit.kayple.com;

    ssl_certificate     /etc/letsencrypt/live/ldg.recruit.kayple.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ldg.recruit.kayple.com/privkey.pem;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 16k;
    limit_req_status 429;

    root /var/www/booking;
    index index.html;

    # API → Spring Boot (외부에서 8080 직접 접근 불가, 127.0.0.1 바인딩)
    # 관리자 로그인 무차별 대입 방어: IP당 분당 5회 (버스트 5)
    location = /api/admin/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 사용자 화면(/), 관리자 화면(/admin): Next.js 정적 export
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
