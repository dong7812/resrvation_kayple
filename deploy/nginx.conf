server {
    listen 80;
    server_name ldg.recruit.kayple.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ldg.recruit.kayple.com;

    ssl_certificate     /etc/letsencrypt/live/ldg.recruit.kayple.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ldg.recruit.kayple.com/privkey.pem;

    root /var/www/booking;
    index index.html;

    # API → Spring Boot (외부에서 8080 직접 접근 불가, 127.0.0.1 바인딩)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 사용자 화면(/), 관리자 화면(/admin): Next.js 정적 export
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
